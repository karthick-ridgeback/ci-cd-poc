name: Sandbox - Build and Deploy
'on':
  push:
    branches: master

jobs:
  buildAndDeploy:
    runs-on: ubuntu-latest
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      PLATFORM_USERNAME: ${{ secrets.CONNECTED_APP_CLIENT_IDD }}
      PLATFORM_PASSWORD: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
      BUS_GROUP_ID: ${{ secrets.GROUP_IDDD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 8

      - name: Publish to Exchange
        run: mvn deploy -s .maven/settings.xml -DskipTests -Dmule.NEXUS_USERNAME=${{env.NEXUS_USERNAME}} -Dmule.NEXUS_PASSWORD=${{env.NEXUS_PASSWORD}} --file pom.xml 

      - name: Deploy to Development
        run: mvn deploy -s .maven/settings.xml -DskipTests -DmuleDeploy -Dmule.NEXUS_USERNAME=${{env.NEXUS_USERNAME}} -Dmule.NEXUS_PASSWORD=${{env.NEXUS_PASSWORD}} --file pom.xml
